<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}KoCaseImport{% endblock %}</title>{% block refresh %}{% endblock %}
<style>body{font-family:system-ui,sans-serif;max-width:900px;margin:36px auto;padding:0 18px;line-height:1.6;color:#202122}header{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}a{color:#245ca6}label{display:block;margin:14px 0 6px}input[type=text],input[type=url]{box-sizing:border-box;width:100%;padding:10px;border:1px solid #a2a9b1;border-radius:4px}button{padding:9px 16px;cursor:pointer}section{margin:24px 0;padding:20px;border:1px solid #c8ccd1;border-radius:8px}.muted{color:#54595d}.error{padding:12px;background:#fee}table{width:100%;border-collapse:collapse}th,td{padding:10px;text-align:left;border-bottom:1px solid #ddd}dl{display:grid;grid-template-columns:150px 1fr;gap:16px}dd{margin:0}.table-wrap{overflow:auto}header form{display:inline}h1{font-size:1.6rem}@media(max-width:550px){dl{grid-template-columns:1fr;gap:4px}dd{margin-bottom:12px}section{padding:14px}}</style>
</head><body><header><a href="{{ url_for('index') }}">KoCaseImport</a>{% if identity and identity.owner_id %}<div>{{ identity.username }} <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ identity.csrf }}"><button type="submit">로그아웃</button></form></div>{% endif %}</header>{% block content %}{% endblock %}</body></html>
